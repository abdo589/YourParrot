<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>METAL FUZE PROJECTS</title>
    <meta name="description" content="Metal Fuze internal projects system" />
    <meta name="theme-color" content="#14284b" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Applied before first paint: saved theme + language/direction for this device.
      (function () {
        try {
          var t = localStorage.getItem("mf-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem("mf-lang") || "ar";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
